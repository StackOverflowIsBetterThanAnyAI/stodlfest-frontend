name: E2E Tests

on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master

permissions:
    contents: read

jobs:
    e2e:
        name: Cypress E2E Tests
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            # a temporary backend with a fresh database, the tests never touch the production data
            - name: Start backend with test data
              run: bash scripts/audit/start-backend.sh
              env:
                  AUDIT_HOST: '127.0.0.1'

            - name: Start app
              run: |
                  npx vite --port 5173 --strictPort --host 127.0.0.1 --mode audit &
                  for attempt in $(seq 1 60); do
                      curl -s -o /dev/null http://127.0.0.1:5173 && exit 0
                      sleep 1
                  done
                  echo "The app did not start" && exit 1

            # Cypress takes the address of the test backend from .env.audit.local
            - name: Run Cypress
              run: npm run cy:run

            - name: Upload screenshots
              uses: actions/upload-artifact@v7
              if: failure()
              with:
                  name: cypress-screenshots
                  path: cypress/screenshots/
